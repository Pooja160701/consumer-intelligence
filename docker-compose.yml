services:

  postgres:
    image: postgres:17-alpine
    container_name: think9-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-think9_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-think9}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-think9_dev_password}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-think9} -d ${POSTGRES_DB:-think9_intelligence}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: think9-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      APP_ENV: production
      DEBUG: "false"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-think9_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-think9}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-think9_dev_password}

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-think9}:${POSTGRES_PASSWORD:-think9_dev_password}@postgres:5432/${POSTGRES_DB:-think9_intelligence}

      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      EMBEDDING_PROVIDER: sentence-transformers
      EMBEDDING_MODEL: all-MiniLM-L6-v2

      VECTOR_STORE: faiss
      RETRIEVAL_TOP_K: 5

    ports:
      - "8000:8000"

volumes:
  postgres_data:
    name: think9_postgres_data