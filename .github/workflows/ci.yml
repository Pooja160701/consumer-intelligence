name: Consumer Intelligence CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: think9
          POSTGRES_PASSWORD: think9_dev_password
          POSTGRES_DB: think9_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U think9 -d think9_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: think9_intelligence
          POSTGRES_USER: think9
          POSTGRES_PASSWORD: think9_dev_password
          DATABASE_URL: postgresql+psycopg://think9:think9_dev_password@localhost:5432/think9_intelligence
        run: alembic upgrade head

      - name: Ruff
        run: ruff check .

      - name: Tests
        env:
          LLM_PROVIDER: mock
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: think9_intelligence
          POSTGRES_USER: think9
          POSTGRES_PASSWORD: think9_dev_password
          DATABASE_URL: postgresql+psycopg://think9:think9_dev_password@localhost:5432/think9_intelligence
        run: pytest -q

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  code-security:
    name: Static Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Run Bandit
        run: bandit -r app -ll

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evaluation:
    name: Intelligence Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation tests
        env:
          LLM_PROVIDER: mock
        run: pytest tests/evaluation -q